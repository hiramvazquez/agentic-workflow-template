# ════════════════════════════════════════════════════════════════════
# harness-ci — el Anillo 3 DEL PROPIO TEMPLATE
# ════════════════════════════════════════════════════════════════════
# El harness exige tests rigurosos a los proyectos que lo adoptan; este
# workflow le aplica la misma medicina a él mismo en cada push:
#
#   · la suite completa (tools/tests/run-tests.sh) en Linux Y macOS —
#     la diferencia de OS ya cazó un bug real (stat -f/-c: un marker de
#     review válido se rechazaba siempre en runners Linux)
#   · lesson-detector-link: toda lección tiene su detector, y existe
#   · validate-harness: eventos de hooks válidos, scripts que parsean,
#     matriz de skills íntegra, reglas semgrep que CARGAN de verdad (G15)
#   · shellcheck a nivel error (bloqueante; hoy: 0 en 59 scripts)
#
# Si esto está en verde, lo que hay en main es un harness cuyos gates
# hacen lo que dicen — no uno que lo parece.
name: harness-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Suite del harness (los tests de los propios gates)
        run: bash tools/tests/run-tests.sh

  gates:
    name: gates del harness (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias reales de los gates
        run: |
          python3 -m pip install --quiet semgrep
          npm install -g lefthook
          lefthook install

      - name: Toda lección tiene detector (y el detector existe)
        run: bash tools/lesson-detector-link.sh

      - name: validate-harness (checks estáticos)
        run: bash tools/validate-harness.sh

      - name: Las reglas semgrep CARGAN y matchean (G15 — --validate no basta)
        run: |
          mkdir -p /tmp/fixture/src
          printf 'func f() {\n  let x = try! decode()\n  let y = z as! T\n}\n' > /tmp/fixture/src/Bad.swift
          N="$(cd /tmp/fixture && semgrep scan --config "$GITHUB_WORKSPACE/tools/semgrep/rules/swift.yaml" --json 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["results"]))')"
          [ "$N" -ge 2 ] || { echo "::error::las reglas swift no matchearon el fixture (N=$N) — reglas mudas"; exit 1; }
          echo "reglas swift OK ($N matches en el fixture)"

      - name: shellcheck (error = bloquea · warnings = informativo, pendiente de triage)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # shellcheck disable=SC2046 -- la lista de archivos no contiene espacios
          shellcheck -S error $(find scripts tools ci -name '*.sh')
          shellcheck -S warning $(find scripts tools ci -name '*.sh') \
            || echo "::notice::hay warnings de shellcheck sin triar — no bloquean, pero redúcelos con el tiempo"
