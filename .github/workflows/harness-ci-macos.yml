# ════════════════════════════════════════════════════════════════════
# harness-ci-macos — la pata macOS de la suite, A DEMANDA
# ════════════════════════════════════════════════════════════════════
# Por qué no corre en cada push: macOS consume minutos de Actions a 10×
# el ritmo de Linux y era el grueso del gasto por push — así se agotó el
# presupuesto del plan (f-787568d2, 2026-08-25). La cobertura macOS por
# push NO se pierde: el pre-push local (lefthook: harness-suite) corre
# la suite completa en el Mac de quien publica, ANTES de publicar.
#
# Cuándo dispararla a mano: antes de un release, o al tocar código
# sensible a diferencias de OS (stat, sed, date, permisos de archivo —
# esa clase ya produjo bugs reales, ver el racional en harness-ci.yml).
#
#   gh workflow run harness-ci-macos.yml
name: harness-ci-macos
on:
  workflow_dispatch:

jobs:
  suite:
    name: suite (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Mismo paso y misma razón que en harness-ci.yml (job `suite`): sin
      # semgrep ni gitleaks, check-source-sets y secret-scan salen 3 —"no pude
      # mirar"— y 10 tests que asertan 0 fallan. Aquí `sudo` no hace falta:
      # /usr/local/bin es escribible por el runner en macOS.
      - name: Dependencias reales de la suite (semgrep + gitleaks)
        run: |
          python3 -m pip install --quiet --break-system-packages semgrep || python3 -m pip install --quiet semgrep
          bash ci/install-gitleaks.sh /usr/local/bin
      - name: Suite del harness (los tests de los propios gates)
        run: bash tools/tests/run-tests.sh
