# ════════════════════════════════════════════════════════════════════
# carril.conf — qué peso tiene un cambio, según lo que toca
# ════════════════════════════════════════════════════════════════════
# FUENTE ÚNICA. La lee `tools/carril.sh`; los patrones NO se duplican en el
# script. Si añades una fila aquí, el veredicto cambia — lo fija
# `test_el_conf_es_la_fuente_unica`.
#
# Formato:  <carril>|<glob>
# Carriles, de más severo a menos:  estructural > normal > ligero
#
# LA MÁS SEVERA GANA. Si un solo fichero del diff es estructural, el cambio
# entero lo es. Al revés —tomar el más leve, o el mayoritario— un cambio
# estructural escondido entre veinte de docs se saltaría la suite, que es el
# único fallo grave que este clasificador puede tener.
#
# Y lo que no casa NINGÚN patrón cae en `normal`, nunca en `ligero`: el default
# tiene que ser el seguro, porque un fichero que nadie previó puede ejecutar.

# ── estructural: la maquinaria que decide QUÉ se verifica ───────────
# Un detector equivocado da un resultado malo. Tocar esto puede hacer que
# NINGÚN detector corra, y eso no lo caza ningún test del propio detector.
estructural|lefthook.yml
estructural|AGENTS.md
estructural|CLAUDE.md
estructural|.claude/settings.json
estructural|.claude/settings*.json
estructural|.claude/agents/*
estructural|scripts/agent-hooks/*
estructural|scripts/agent-hooks/*/*
estructural|ci/*
estructural|tools/verify.conf
estructural|tools/carril.sh
estructural|tools/carril.conf
estructural|tools/tests/run-tests.sh
estructural|.cursor/*
estructural|.codex/*

# ── ligero: nada que se ejecute ─────────────────────────────────────
# Documentación y prosa. El escaneo de secretos corre igual: un secreto en un
# .md es un secreto.
#
# Los FIXTURES no están aquí, aunque la tabla del PRD los listara: un fixture es
# la entrada que un test interpreta, así que SÍ se ejecuta. En `ligero` no corría
# ninguno — cambiar el dato con el que se afirma algo quedaba sin verificar. En
# `normal` (el default) la derivación por referencia encuentra los que lo nombran.
ligero|docs/*
ligero|docs/*/*
ligero|docs/*/*/*
ligero|*.md
ligero|README*

# ── Los tests que validan la DOCUMENTACIÓN, no el código ────────────
# `ligero` no puede significar "cero tests": estos leen la doc REAL del repo y
# la contrastan con el ledger, así que un cambio de solo-prosa SÍ los ejecuta.
# Pasó de verdad — un commit de docs con tres ids de finding mal citados salió
# ligero, corrió cero tests y puso la suite en rojo. El clasificador hizo lo que
# esta tabla decía; lo que estaba mal era la tabla.
#
# La derivación por referencia NO los encuentra: leen la doc con rutas armadas
# sobre $PROJECT_ROOT, no nombran el fichero tocado, así que hay que declararlos.
#
# La lista se saco con:  grep -l 'PROJECT_ROOT.*docs/' tools/tests/test_*.sh
# y sale caducada en cuanto alguien anada otro, por eso hay un test que exige
# que cada entrada EXISTA — un typo aqui deja el carril mudo y `run-tests` sale
# 0 cuando un filtro no casa. Lo que ese test NO puede saber es si FALTA uno:
# eso sigue siendo lectura humana, y la primera version de esta lista ya se
# dejo `test_lessons_presupuesto_contexto` fuera aunque el finding que la pedia
# lo nombraba.
verifica-doc|test_finding_refs
verifica-doc|test_execution_map
verifica-doc|test_lessons_presupuesto_contexto
verifica-doc|test_e2e_plataformas_y_vinculo
verifica-doc|test_secret_scan
verifica-doc|test_skill_matrix
verifica-doc|test_comandos_citan_lo_que_existe
