# ════════════════════════════════════════════════════════════════════
# project.conf — declaraciones de ESTE proyecto (propiedad del adoptante)
# ════════════════════════════════════════════════════════════════════
# Formato: `clave: valor`, una clave por línea. Este archivo vive FUERA del
# sync de tools/upgrade.sh (como tools/preset): el upgrade lo CREA con un
# valor inferido si falta y JAMÁS lo pisa. Es tuyo.
#
# project_kind — qué es el PRODUCTO de este repo (PRD 0005 §6, WF-05).
# La declaración GOBIERNA los gates de scope (review/verify-marker); la
# evidencia solo verifica: una contradicción declarado-vs-evidencia avisa
# (y en CI devuelve exit 3), pero nunca cambia el criterio. Tres valores:
#
#   harness      el producto es el propio harness: tools/, scripts/, ci/ y
#                AGENTS.md exigen review. Es lo que declara el template.
#   application  proyecto de app: tools/ y scripts/ son andamio exento; el
#                producto son las fuentes de la app (ios/, packages/, …).
#   other        exención amplia estilo app para repos SIN fuentes de app
#                (doc-only, datos, infra): sus directorios de contenido no
#                exigen review. Quien quiera review sobre docs declara harness.
#
# ⚠️ ADOPCIÓN POR COPIA: este archivo llega declarando `harness` porque el
# template ES el harness. Si tu repo no lo es, FLIPEA el valor en el primer
# arranque; hasta entonces la contradicción con la evidencia lo delata en
# cada gate (SCOPE_SUMMARY … evidencia=contradice) y en CI corta con exit 3.
project_kind: harness
